name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm run lint

  build:
    name: Build (tsc)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm run build

  test-extractor:
    name: Test extractor (GATE 1.6)
    runs-on: ubuntu-latest
    needs: build
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @logsguardian/extractor test

  test-core:
    name: Test core (CLI, middleware, store, webhook)
    runs-on: ubuntu-latest
    needs: build
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # packages/core's tests import from its own dist/ and from @logsguardian/extractor's
      # dist/ (workspace package resolution) — both must be built first, unlike test-extractor
      # which runs ts-jest directly against src/.
      - run: pnpm run build
      # parity.node.test.ts and smoke.test.ts are excluded, both deliberately, both
      # real-ONNX-model dependent — not CLI/middleware logic:
      #   - parity.node.test.ts: exact numeric parity between Python and Node ONNX runtimes.
      #     Its beforeAll hook has exceeded Jest's default timeout in this environment.
      #   - smoke.test.ts: its "with real models" test has been observed to fail
      #     intermittently (reproduced locally, not caused by CLI/middleware changes) —
      #     unreliable enough to gate a PR on right now. Its 3 model-free tests would be
      #     lost too since Jest excludes by file, not by test — acceptable tradeoff until
      #     that test is made reliable as separate work.
      # Both exclusions live in jest.config.js's "default" project, not as a CLI flag
      # here: `jest --testPathIgnorePatterns <...>` REPLACES a project's own
      # testPathIgnorePatterns instead of merging with it, which previously silently
      # un-excluded cli-config-set.test.ts too (it's excluded from "default"
      # specifically because running it alongside other files reproduces a
      # documented, unresolved cross-file interference flake — see jest.config.js)
      # and let that flake intermittently fail unrelated tests in this same run.
      # --selectProjects only chooses which configured projects run; it can't
      # clobber any project's own exclusions.
      # --forceExit works around onnxruntime-node/worker_threads not always exiting cleanly;
      # without it, this job can hang after tests already reported pass/fail.
      - name: Test core (cd into package — pnpm's `--` arg forwarding mishandles jest flags)
        working-directory: packages/core
        run: |
          npx jest --selectProjects default --forceExit
          npx jest --selectProjects cli-config-set-isolated --runInBand --forceExit

  test-mlops:
    name: Test mlops (collector, review-clusters)
    runs-on: ubuntu-latest
    needs: build
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # mlops imports @logsguardian/extractor's dist/ (workspace package
      # resolution), so extractor must be built first, same as test-core.
      - run: pnpm run build
      - run: pnpm --filter @logsguardian/mlops test

  publish:
    name: Publish logsguardian to npm
    runs-on: ubuntu-latest
    needs: [lint, build, test-extractor, test-core, test-mlops]
    # Only ever runs on main itself (i.e. after a develop -> main merge lands),
    # never on develop or on pull_request events - publishing must not be
    # triggerable from a PR branch. `environment: npm-publish` is optional
    # protection: create that environment under Settings > Environments and
    # add required reviewers there to turn this into a manual-approval gate
    # before the actual `pnpm publish` step runs, without losing the
    # "triggers automatically from the merge" behavior. Unconfigured, it's a
    # no-op label.
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    environment: npm-publish
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
          registry-url: "https://registry.npmjs.org"
      - run: pnpm install --frozen-lockfile
      # Order matters: extractor must be built before core (core's postbuild
      # step copies ONNX models; core's own build doesn't need extractor's
      # dist to exist first, but a published tarball with a stale extractor
      # build would defeat the point of publishing from CI at all).
      - run: pnpm --filter @logsguardian/extractor run build
      - run: pnpm --filter logsguardian run build
      # Skip (not fail) when package.json's version is already on the
      # registry - lets every ordinary push to main run this job harmlessly
      # instead of erroring out on `npm publish` for a version that hasn't
      # been bumped. Bump packages/core/package.json's version to actually
      # trigger a new publish.
      - name: Check whether this version is already published
        id: version_check
        working-directory: packages/core
        run: |
          LOCAL_VERSION=$(node -p "require('./package.json').version")
          PUBLISHED_VERSION=$(npm view logsguardian version 2>/dev/null || echo "none")
          echo "local=$LOCAL_VERSION" >> "$GITHUB_OUTPUT"
          echo "published=$PUBLISHED_VERSION" >> "$GITHUB_OUTPUT"
      - name: Publish (pnpm publish, not npm — resolves workspace:* and bundledDependencies correctly)
        if: steps.version_check.outputs.local != steps.version_check.outputs.published
        working-directory: packages/core
        run: pnpm publish --access public --no-git-checks
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
